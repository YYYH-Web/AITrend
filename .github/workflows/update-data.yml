name: 一鍵更新資料

on:
  # 每天自動更新兩次（台北時間 02:20、08:20、14:20、20:20；GitHub 排程使用 UTC）
  schedule:
    - cron: "20 */6 * * *"    
  # 網頁「更新資料」按鈕或 Actions 頁面手動執行
  workflow_dispatch:
    inputs:
      watchlist:
        description: 追蹤清單（網頁自動帶入，可留空使用 data/watchlist.json）
        required: false
        default: ""
      scope:
        description: 更新範圍 all / market / news
        required: false
        default: all

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 排程執行時沒有 inputs，預設為 all
      SCOPE: ${{ inputs.scope || 'all' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt

      - name: 行情與財報
        if: env.SCOPE == 'all' || env.SCOPE == 'market'
        env:
          WATCHLIST: ${{ inputs.watchlist }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python scripts/update_market.py
        
      - name: 台股 ETF 持股
        if: env.SCOPE == 'all' || env.SCOPE == 'market'
        continue-on-error: true
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python scripts/update_etf.py
        
      - name: 新聞頭條
        if: env.SCOPE == 'all' || env.SCOPE == 'news'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/update_news.py

      - name: 提交更新
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "沒有變更"; exit 0; fi
          git commit -m "data: 更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
