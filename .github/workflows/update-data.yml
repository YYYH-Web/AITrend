name: 一鍵更新資料

on:
  workflow_dispatch:
    inputs:
      watchlist:
        description: 追蹤清單（網頁自動帶入，可留空使用 data/watchlist.json）
        required: false
        default: ""
      scope:
        description: 更新範圍 all / market / news
        required: false
        default: all

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt

      - name: 行情與財報
        if: inputs.scope == 'all' || inputs.scope == 'market'
        env:
          WATCHLIST: ${{ inputs.watchlist }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python scripts/update_market.py

      - name: 新聞頭條
        if: inputs.scope == 'all' || inputs.scope == 'news'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/update_news.py

      - name: 提交更新
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "沒有變更"; exit 0; fi
          git commit -m "data: 更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
